<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  :root { --bg: #f7f8fb; --fg: #0f172a; --muted: #55627a; --accent: #2563eb; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #070b16; --fg: #e6ebf5; --muted: #94a0b8; --accent: #60a5fa; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 1.75rem; }
  p { margin: 0; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page does not exist. <a href="/">Go to the Enversion Labs home page</a>.</p>
</main>
</body>
</html>
